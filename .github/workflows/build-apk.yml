name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: zip 풀기
        run: |
          for z in $(ls *.zip 2>/dev/null); do unzip -q -o "$z"; done
          echo "DIR=$(dirname $(find . -name settings.gradle.kts | head -1))" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 서명 키 풀고 빌드
        working-directory: ${{ env.DIR }}
        run: |
          if [ -f app/debug.keystore.base64 ]; then
            base64 -d app/debug.keystore.base64 > app/debug.keystore
          fi
          gradle assembleDebug --no-daemon
      - run: cp "$(find . -name '*-debug.apk' | head -1)" jubo-ledger.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: jubo-ledger.apk
