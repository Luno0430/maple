name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 프로젝트 찾기 ─────────────────────────────────────
      # zip 으로 올렸든 폴더째 올렸든 settings.gradle.kts 만 찾으면 됩니다.
      - name: 프로젝트 찾기
        run: |
          {
            echo "## 저장소에 올라온 것"
            echo '```'
            ls -la
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

          for z in *.zip; do
            [ -e "$z" ] || continue
            echo "푸는 중: $z"
            unzip -q -o "$z"
          done

          FOUND=$(find . -name settings.gradle.kts | head -1)
          if [ -z "$FOUND" ]; then
            {
              echo "## ❌ 프로젝트를 찾지 못했습니다"
              echo "저장소에서 \`settings.gradle.kts\` 를 못 찾았습니다."
              echo ""
              echo "- **JuboLedger.zip** 을 저장소 맨 위(루트)에 올렸는지 확인해 주세요."
              echo "- 압축을 푼 **JuboLedger 폴더**를 올려도 됩니다."
              echo "- 위의 파일 목록에 둘 중 하나가 보여야 합니다."
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "DIR=$(dirname "$FOUND")" >> $GITHUB_ENV
          echo "프로젝트 위치: $(dirname "$FOUND")"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ── 빌드 ──────────────────────────────────────────────
      - name: 빌드
        id: build
        continue-on-error: true
        working-directory: ${{ env.DIR }}
        env:
          # 빌드마다 올라가는 번호 — 폰이 새 버전으로 인식하게 합니다
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_NAME: 1.${{ github.run_number }}
        run: |
          if [ -f app/debug.keystore.base64 ]; then
            base64 -d app/debug.keystore.base64 > app/debug.keystore
          fi
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/build.log

      # 실패하면 오류를 실행 페이지 Summary 에 그대로 적습니다.
      # 단계를 하나씩 펼쳐보지 않아도 바로 보이게 하려는 것입니다.
      - name: 실패 원인 적기
        if: steps.build.outcome != 'success'
        run: |
          {
            echo "## ❌ 빌드 실패"
            echo "아래는 Gradle 이 마지막으로 뱉은 내용입니다. 이 부분을 그대로 보내주세요."
            echo '```'
            grep -nE "^e: |error:|FAILURE|What went wrong|Caused by" /tmp/build.log | head -40 || true
            echo '```'
            echo "<details><summary>전체 로그 끝부분</summary>"
            echo ""
            echo '```'
            tail -n 120 /tmp/build.log 2>/dev/null || echo "빌드 로그가 없습니다 (Gradle 이 시작도 못 했습니다)"
            echo '```'
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY
          exit 1

      - run: cp "$(find . -name '*-debug.apk' | head -1)" jubo-ledger.apk

      # 태그는 앱 버전과 같게(v1.24), 제목은 사람이 읽기 좋게
      - name: 릴리스 이름 만들기
        run: |
          echo "TAG=v1.${{ github.run_number }}" >> $GITHUB_ENV
          echo "TITLE=주간 메이플 1.${{ github.run_number }} · $(TZ=Asia/Seoul date +'%-m월 %-d일')" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TITLE }}
          body: |
            ## 설치 방법

            폰에서 아래 **jubo-ledger.apk** 를 눌러 받고, 다운로드 알림을 눌러 설치하세요.

            - "출처를 알 수 없는 앱" 경고가 뜨면 **설정 → 허용** 을 누르고 다시 설치하면 됩니다.
            - Play 프로텍트가 "개발자가 확인되지 않았습니다" 라고 하면 **무시하고 설치** 를 누르세요.
            - 이미 깔려 있으면 그 위에 그대로 덮어써집니다. 기록은 지워지지 않습니다.

            ## 처음 켰을 때

            더보기 → 캐릭터 불러오기 → **넥슨에서 키 받기** 를 눌러 안내대로 하시면 됩니다.
            넥슨 키는 각자 자기 계정으로 하나씩 받아야 하고, 남에게 주면 안 됩니다.

            버전 1.${{ github.run_number }}
          files: jubo-ledger.apk

      - name: 다 됐다고 적기
        run: |
          {
            echo "## ✅ 빌드 성공"
            echo "릴리스: **주간 메이플 1.${{ github.run_number }}**"
          } >> $GITHUB_STEP_SUMMARY

      - name: 오래된 릴리스 정리 (최근 3개만 남김)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | tail -n +4 \
            | while read t; do
                echo "삭제: $t"
                gh release delete "$t" --cleanup-tag --yes || true
              done
